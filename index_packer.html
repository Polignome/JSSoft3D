<script>

   var packer=new Archive();

  function ConvertToArray() {
    s=packer.ConvertToDataArray();
    document.getElementById("mapsource").value=s;
  }

  function Clear() {
    document.getElementById("mapsource").value="";
    packer=new Archive();
  }


  function Test() {
    document.getElementById("mapsource").value="";
    packer=new Archive(DATA);
  }


  function AddToArchive() {


    var text=    document.getElementById("mapsource").value; 
          
    let st=packer.encode(text);
    document.getElementById("mapsource").value="";
    //DebugOut(packer.decode(st)+"\n");
  }
  
</script>
